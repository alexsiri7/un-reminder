# Required Worker secrets (set via wrangler secret put):
#   SENTRY_DSN       — (optional) Sentry DSN for error tracking
#   UR_REQUESTY_KEY  — Requesty.ai API key for LLM calls
#   UR_PLAY_INTEGRITY_SA_KEY — service-account JSON key that decodes Play Integrity tokens
#                              (README.md, "Play Integrity"); unset ⇒ non-exempt requests get 503
# Per-user auth tokens live as salted hashes in the UR_TOKENS namespace below;
# mint and revoke them with `npm run tokens` (see README.md).
#
# CI deploy (.github/workflows/deploy-worker.yml) needs CLOUDFLARE_API_TOKEN
# (a *user-owned* token from dash.cloudflare.com/profile/api-tokens) with:
#   - Account → Workers Scripts:     Edit   (wrangler deploy)
#   - Account → Workers KV Storage:  Edit   (this Worker uses [[kv_namespaces]] below)
#   - Account → Account Settings:    Read   (wrangler 4.x calls /memberships)
#   - User → User Details:           Read   (wrangler whoami)
# Account resources scope: limit to the account that owns this Worker.
# Stored as the CLOUDFLARE_API_TOKEN repo secret. Rotating it without these scopes
# reproduces issue #199 (Authentication error [code: 10000] / [code: 9106]).

name = "un-reminder-worker"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

[vars]
# Service-wide spend ceiling across every token — the backstop on the bill.
UR_DAILY_CAP_CENTS  = "50"
UR_MONTHLY_CAP_CENTS = "500"
# What each token may spend unless its record overrides it (`npm run tokens -- caps`, README.md).
UR_USER_DAILY_CAP_CENTS  = "20"
UR_USER_MONTHLY_CAP_CENTS = "200"
UR_MODEL = "google/gemini-3.6-flash"
# Bump whenever UR_MODEL or buildPrompt (src/routes/generateBatch.ts) changes: every device
# regenerates every active habit's pool once per bump, paced about one habit per minute.
# Must be an integer >= 1 — the app reads 0 as "generated before versions existed".
# Which model and prompt each version ran is recorded in README.md (Generation version history).
UR_GENERATION_VERSION = "2"

[[kv_namespaces]]
binding = "UR_SPEND"
id      = "ba35d7eb3c4b4e46b18707a20ce89d1e"

# Run `npx wrangler kv namespace create UR_TOKENS` and paste the returned id here before
# merging; the placeholder makes `wrangler deploy` fail rather than deploy without an auth store.
[[kv_namespaces]]
binding = "UR_TOKENS"
id      = "REPLACE_WITH_ID_FROM_wrangler_kv_namespace_create_UR_TOKENS"

[[ratelimits]]
name         = "REQUEST_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit  = 60
  period = 60
