name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The default GITHUB_TOKEN is read-only for this repo; the auto-record step below
    # pushes refreshed Paparazzi goldens to the PR branch and needs write access.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests
        id: unit_tests
        run: ./gradlew test :app:verifyPaparazziRelease --stacktrace
        continue-on-error: true

      - name: Upload Paparazzi diff report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-diff-${{ github.sha }}
          # verifyPaparazzi* writes delta-*.png (expected | actual | diff) under
          # build/paparazzi/failures, not under the HTML report directory.
          path: |
            app/build/reports/paparazzi/
            app/build/paparazzi/failures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record Paparazzi snapshots
        if: steps.unit_tests.outcome == 'failure' && github.event_name == 'pull_request'
        id: record
        run: |
          ./gradlew :app:recordPaparazziRelease --no-configuration-cache
          git add app/src/test/snapshots/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # The message carries no CI-skip marker: a squash merge concatenates the PR's
      # commit subjects into main's commit message, where such a marker suppresses the
      # push-triggered CI and Release runs (#351). The push cannot loop regardless — it
      # is made with the default GITHUB_TOKEN, whose pushes create no workflow runs.
      - name: Commit updated snapshots to PR branch
        if: steps.record.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Paparazzi snapshots"
          git push

      - name: Fail — snapshots updated, review required
        if: steps.record.outputs.changed == 'true'
        run: |
          echo "::error::Paparazzi snapshots were updated and committed to this branch. Review the image diffs in the PR and the 'paparazzi-diff' artifact, then re-run CI to confirm."
          exit 1

      - name: Fail — tests failed (non-snapshot reason)
        if: steps.unit_tests.outcome == 'failure' && steps.record.outputs.changed != 'true'
        run: exit 1

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is not set — release APK cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: ./gradlew assembleRelease --stacktrace

      # Unit tests run unminified and a missing keep rule still builds, so this is the only
      # check that fails if the -keepnames rule in app/proguard-rules.pro stops covering the
      # app's own throwables, whose simple names LocationFaultLabel shows in the health row.
      - name: Verify R8 kept the app's throwable names
        run: |
          awk -F' -> ' '
            /^net\.interstellarai\.unreminder\..*Exception -> / {
              kept++
              if ($2 != $1 ":") renamed = renamed "  " $0 "\n"
            }
            END {
              if (kept == 0) {
                print "::error::No app-owned exception appears in mapping.txt, so this check can no longer prove -keepnames is in effect."
                exit 1
              }
              if (renamed != "") {
                print "::error::R8 renamed app-owned throwables, so the -keepnames rule in app/proguard-rules.pro is missing or too narrow:"
                printf "%s", renamed
                exit 1
              }
              print "R8 kept " kept " app-owned exception names."
            }
          ' app/build/outputs/mapping/release/mapping.txt

      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  worker-checks:
    name: Worker type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

  tools-tests:
    name: Slicer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Run tests
        run: python3 -m pytest tools/ -q
