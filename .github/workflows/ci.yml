name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Requirement-doc PRs can't affect anything the jobs below check, so they skip their
  # steps. The jobs themselves still run and report success: a job skipped outright
  # (job-level `if:` or `paths-ignore`) posts no check run, which leaves a required
  # status check pending forever (#467). The `!cancelled()` on those jobs keeps a failed
  # classification from skipping them too; its empty output runs every step.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails open: anything unresolvable (e.g. the all-zero `before` of a new branch)
      # classifies as not docs-only, so the full suite runs.
      - name: Classify
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if changed=$(git diff --name-only "$BASE" "$GITHUB_SHA") \
              && [ -n "$changed" ] \
              && ! grep -qv '^requirements/' <<< "$changed"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & test
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The default GITHUB_TOKEN is read-only for this repo; the auto-record step below
    # pushes refreshed Paparazzi goldens to the PR branch and needs write access.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: needs.changes.outputs.docs_only != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        if: needs.changes.outputs.docs_only != 'true'
        run: ./gradlew lint --stacktrace

      - name: Unit tests
        if: needs.changes.outputs.docs_only != 'true'
        id: unit_tests
        run: ./gradlew test :app:verifyPaparazziRelease --stacktrace
        continue-on-error: true

      - name: Upload Paparazzi diff report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-diff-${{ github.sha }}
          # verifyPaparazzi* writes delta-*.png (expected | actual | diff) under
          # build/paparazzi/failures, not under the HTML report directory.
          path: |
            app/build/reports/paparazzi/
            app/build/paparazzi/failures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record Paparazzi snapshots
        if: steps.unit_tests.outcome == 'failure' && github.event_name == 'pull_request'
        id: record
        run: |
          ./gradlew :app:recordPaparazziRelease --no-configuration-cache
          git add app/src/test/snapshots/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # The message carries no CI-skip marker: a squash merge concatenates the PR's
      # commit subjects into main's commit message, where such a marker suppresses the
      # push-triggered CI and Release runs (#351). The push cannot loop regardless — it
      # is made with the default GITHUB_TOKEN, whose pushes create no workflow runs.
      - name: Commit updated snapshots to PR branch
        if: steps.record.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Paparazzi snapshots"
          git push

      - name: Fail — snapshots updated, review required
        if: steps.record.outputs.changed == 'true'
        run: |
          echo "::error::Paparazzi snapshots were updated and committed to this branch. Review the image diffs in the PR and the 'paparazzi-diff' artifact, then re-run CI to confirm."
          exit 1

      - name: Fail — tests failed (non-snapshot reason)
        if: steps.unit_tests.outcome == 'failure' && steps.record.outputs.changed != 'true'
        run: exit 1

      - name: Decode release keystore
        if: needs.changes.outputs.docs_only != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is not set — release APK cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Warn if Play Integrity project number is missing
        if: needs.changes.outputs.docs_only != 'true'
        env:
          PLAY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_CLOUD_PROJECT_NUMBER }}
        run: |
          if [ -z "$PLAY_CLOUD_PROJECT_NUMBER" ]; then
            echo "::warning::PLAY_CLOUD_PROJECT_NUMBER secret is not set — this release APK cannot self-register, and the Release workflow will refuse to build. See worker/README.md § Play Integrity, step 4."
          fi

      - name: Assemble signed release APK
        if: needs.changes.outputs.docs_only != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PLAY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_CLOUD_PROJECT_NUMBER }}
        run: ./gradlew assembleRelease --stacktrace

      # Unit tests run unminified and a missing keep rule still builds, so this is the only
      # check that fails if the -keepnames rule in app/proguard-rules.pro stops covering the
      # app's own throwables, whose simple names LocationFaultLabel shows in the health row.
      - name: Verify R8 kept the app's throwable names
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          awk -F' -> ' '
            /^net\.interstellarai\.unreminder\..*Exception -> / {
              kept++
              if ($2 != $1 ":") renamed = renamed "  " $0 "\n"
            }
            END {
              if (kept == 0) {
                print "::error::No app-owned exception appears in mapping.txt, so this check can no longer prove -keepnames is in effect."
                exit 1
              }
              if (renamed != "") {
                print "::error::R8 renamed app-owned throwables, so the -keepnames rule in app/proguard-rules.pro is missing or too narrow:"
                printf "%s", renamed
                exit 1
              }
              print "R8 kept " kept " app-owned exception names."
            }
          ' app/build/outputs/mapping/release/mapping.txt

      # The Sentry plugin stamps the mapping's UUID into the APK only when it uploads that
      # mapping, so this fails if the SENTRY_AUTH_TOKEN gate in app/build.gradle.kts stops
      # matching the token: without the upload, Sentry shows obfuscated frames again (#231).
      - name: Verify the R8 mapping upload follows SENTRY_AUTH_TOKEN
        if: needs.changes.outputs.docs_only != 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          meta=$(unzip -p "$apk" assets/sentry-debug-meta.properties || true)
          if grep -q '^io\.sentry\.ProguardUuids=' <<<"$meta"; then
            stamped=true
          else
            stamped=false
          fi
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ "$stamped" = false ]; then
            echo "::error::SENTRY_AUTH_TOKEN is set but the release APK carries no ProGuard UUID, so the R8 mapping was not uploaded to Sentry."
            exit 1
          fi
          if [ -z "$SENTRY_AUTH_TOKEN" ] && [ "$stamped" = true ]; then
            echo "::error::SENTRY_AUTH_TOKEN is unset but the release APK carries a ProGuard UUID, so the mapping-upload gate no longer follows the token."
            exit 1
          fi
          echo "R8 mapping upload matches SENTRY_AUTH_TOKEN (ProGuard UUID stamped: $stamped)."

      - name: Upload signed release APK
        if: success() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  worker-checks:
    name: Worker type-check & tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Type-check
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run test

  tools-tests:
    name: Slicer tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install -r tools/requirements.txt

      - name: Run tests
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 -m pytest tools/ -q
