name: OpenSpec

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: openspec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_TELEMETRY: 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate
        run: npx -y @fission-ai/openspec@1.14.0 validate --specs --strict
